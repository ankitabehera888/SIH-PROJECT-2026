version: '3.8'

services:
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare_airflow_webserver
    restart: unless-stopped
    depends_on:
      - airflow-scheduler
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://healthcare:healthcare_dev_password@healthcare_postgres:5432/airflow_db
      - AIRFLOW__CELERY__BROKER_URL=redis://healthcare_redis:6379/1
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW_ADMIN_USERNAME=admin
      - AIRFLOW_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - ../../airflow/config:/opt/airflow/config
      - ../../src:/opt/airflow/src
      - ../../configs:/opt/airflow/configs
      - ../../sql:/opt/airflow/sql
    networks:
      - healthcare_network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare_airflow_scheduler
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://healthcare:healthcare_dev_password@healthcare_postgres:5432/airflow_db
      - AIRFLOW__CELERY__BROKER_URL=redis://healthcare_redis:6379/1
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/plugins:/opt/airflow/plugins
      - ../../airflow/config:/opt/airflow/config
      - ../../src:/opt/airflow/src
      - ../../configs:/opt/airflow/configs
      - ../../sql:/opt/airflow/sql
    networks:
      - healthcare_network

networks:
  healthcare_network:
    external: true
    name: healthcare_default
