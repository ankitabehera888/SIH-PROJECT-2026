events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting: 20 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    upstream backend_api {
        server backend:8000;
    }

    upstream airflow_ui {
        server airflow-webserver:8080;
    }

    server {
        listen 80;
        server_name healthcare.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name healthcare.local;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Reverse Proxy to FastAPI Backend
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse Proxy to Airflow UI (Admin Only)
        location /airflow/ {
            proxy_pass http://airflow_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Probe Endpoint
        location /health {
            proxy_pass http://backend_api/api/v1/health;
        }
    }
}
