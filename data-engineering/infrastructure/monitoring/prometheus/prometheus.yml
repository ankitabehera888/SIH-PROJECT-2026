global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fastapi_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'postgres_database'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'redis_cache'
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: 'airflow_scheduler'
    static_configs:
      - targets: ['airflow-scheduler:8080']
